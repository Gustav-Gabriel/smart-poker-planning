<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Smart Planning Poker">
  <defs>
    <linearGradient id="bg" x1="6" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <!-- App tile (matches wordmark mark) -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Playing card -->
  <rect x="9" y="5" width="14" height="20" rx="2.2" fill="#ffffff"/>
  <!-- Suit (diamond)  planning / poker cue -->
  <path
    fill="#6d28d9"
    d="M16 9.2 18.9 13.5 16 17.8 13.1 13.5Z"
  />
  <!-- Vote pips -->
  <circle cx="12.2" cy="20.6" r="1.15" fill="#6d28d9"/>
  <circle cx="16" cy="20.6" r="1.15" fill="#6d28d9"/>
  <circle cx="19.8" cy="20.6" r="1.15" fill="#6d28d9"/>
</svg>
